<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Timezone Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    .header {
      padding: 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .header h1 {
      font-size: 28px;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .header p {
      font-size: 14px;
      opacity: 0.9;
    }
    .content {
      padding: 2rem;
    }
    .grid-wrapper {
      overflow-x: auto;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 2rem;
    }
    .grid {
      display: flex;
      min-width: min-content;
    }
    .grid-column {
      display: flex;
      flex-direction: column;
    }
    .grid-cell {
      width: 50px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      font-size: 12px;
      font-weight: 500;
    }
    .header-cell {
      background: #667eea;
      color: white;
      font-weight: 600;
    }
    .name-cell {
      width: 200px;
      flex-shrink: 0;
      padding: 1rem;
      background: #f5f5f5;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
      font-size: 13px;
      font-weight: 500;
      border-right: 2px solid #667eea;
    }
    .name-cell:hover {
      background: #ece7f1;
    }
    .name-cell strong {
      display: block;
      margin-bottom: 4px;
    }
    .name-cell small {
      font-size: 11px;
      color: #666;
      font-weight: 400;
    }
    .working-hour {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-weight: 600;
    }
    .row {
      display: flex;
    }
    .row:nth-child(even) .grid-cell:not(.working-hour) {
      background: #fafafa;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .modal-content h2 {
      margin-bottom: 1.5rem;
      color: #333;
      font-size: 20px;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }
    button {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    .close-btn {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
      width: auto;
      padding: 0;
    }
    .close-btn:hover {
      color: #333;
    }
    .info {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 1rem;
      border-radius: 6px;
      font-size: 13px;
      color: #333;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌍 Team Timezone Map</h1>
      <p>Todos os horários em GMT+0 (referência Portugal). Verde = horários de trabalho.</p>
    </div>

    <div class="content">
      <div class="grid-wrapper">
        <div class="grid" id="grid"></div>
      </div>

      <div class="info">
        📋 <strong>Info:</strong> Cada pessoa trabalha 8h/dia com 1h de intervalo. Clique no nome para editar. Os dados são salvos automaticamente no seu navegador.
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content" style="position: relative;">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2>Editar <span id="modalName"></span></h2>

      <div class="form-group">
        <label>País</label>
        <input type="text" id="editCountry">
      </div>

      <div class="form-group">
        <label>Offset GMT</label>
        <input type="number" id="editOffset" step="0.25">
      </div>

      <div class="form-group">
        <label>Início (hora em Portugal GMT+1)</label>
        <input type="number" id="editStart" step="0.01" placeholder="Ex: 9 para 9am">
      </div>

      <div class="form-group">
        <label>Fim (hora em Portugal GMT+1)</label>
        <input type="number" id="editEnd" step="0.01" placeholder="Ex: 18 para 6pm">
      </div>

      <div class="button-group">
        <button class="btn-primary" onclick="saveEdit()">Salvar</button>
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const data = [
      { name: 'Mitali', country: 'India', offset: 4.5, start: 3, end: 11.5 },
      { name: 'Ranjana', country: 'India', offset: 4.5, start: 3 + 41/60, end: 12 + 10/60 },
      { name: 'Aleksandar', country: 'Serbia', offset: 2, start: 6, end: 14 },
      { name: 'Renata', country: 'Portugal', offset: 1, start: 9, end: 18 },
      { name: 'Juan', country: 'Argentina', offset: -4, start: 11 + 10/60, end: 19 + 10/60 },
      { name: 'Hannes', country: 'Brazil', offset: -4, start: 12, end: 20 },
      { name: 'João', country: 'Brazil', offset: -4, start: 15, end: 23 },
      { name: 'Marco', country: 'Costa Rica', offset: -6, start: 15, end: 24 },
      { name: 'Everton', country: 'Brazil', offset: -4, start: 18, end: 27 }
    ];

    let teamData = JSON.parse(localStorage.getItem('teamSchedule')) || data;
    let editingIndex = -1;

    function formatTime(hours) {
      const h = Math.floor(hours);
      const m = Math.round((hours - h) * 60);
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      // Header
      const headerRow = document.createElement('div');
      headerRow.className = 'row';

      const headerName = document.createElement('div');
      headerName.className = 'grid-cell header-cell name-cell';
      headerName.textContent = 'GMT+0';
      headerName.style.cursor = 'default';
      headerRow.appendChild(headerName);

      for (let h = 0; h < 24; h++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell header-cell';
        cell.textContent = h;
        headerRow.appendChild(cell);
      }
      grid.appendChild(headerRow);

      // Data rows
      teamData.forEach((member, idx) => {
        const row = document.createElement('div');
        row.className = 'row';

        const nameCell = document.createElement('div');
        nameCell.className = 'name-cell';
        nameCell.innerHTML = `<strong>${member.name}</strong><small>${member.country} (GMT${member.offset > 0 ? '+' : ''}${member.offset})</small>`;
        nameCell.onclick = () => openModal(idx);
        row.appendChild(nameCell);

        for (let h = 0; h < 24; h++) {
          const cell = document.createElement('div');
          cell.className = 'grid-cell';

          const isWorking = (member.start <= member.end)
            ? (h >= member.start && h < member.end)
            : (h >= member.start || h < member.end);

          if (isWorking) {
            cell.classList.add('working-hour');
          }
          row.appendChild(cell);
        }

        grid.appendChild(row);
      });

      localStorage.setItem('teamSchedule', JSON.stringify(teamData));
    }

    function openModal(idx) {
      editingIndex = idx;
      const member = teamData[idx];
      document.getElementById('modalName').textContent = member.name;
      document.getElementById('editCountry').value = member.country;
      document.getElementById('editOffset').value = member.offset;
      document.getElementById('editStart').value = member.start;
      document.getElementById('editEnd').value = member.end;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function saveEdit() {
      const member = teamData[editingIndex];
      member.country = document.getElementById('editCountry').value;
      member.offset = parseFloat(document.getElementById('editOffset').value);
      member.start = parseFloat(document.getElementById('editStart').value);
      member.end = parseFloat(document.getElementById('editEnd').value);

      render();
      closeModal();
    }

    window.onclick = (e) => {
      const modal = document.getElementById('modal');
      if (e.target === modal) closeModal();
    };

    render();
  </script>
</body>
</html>

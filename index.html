<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Timezone Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.18), transparent 30%),
                  linear-gradient(180deg, #0b1543 0%, #1d2b64 45%, #e7efff 100%);
      color: #111827;
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
      padding: 0.4rem;
      width: fit-content;
      max-width: 100%;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
    .tab-button {
      flex: 0 1 auto;
      padding: 0.7rem 1rem;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .tab-button:hover {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      transform: none;
    }
    .tab-button.active {
      background: white;
      color: #3730a3;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.14);
    }
    .view-label {
      margin-bottom: 0.5rem;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 0.5rem;
      color: #ffffff;
      font-size: clamp(2rem, 2.5vw, 3rem);
      line-height: 1.05;
    }
    .hero {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .hero p {
      max-width: 760px;
      font-size: 1rem;
      line-height: 1.75;
      color: #ffffff
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      font-size: 0.95rem;
      color: rgba(17, 24, 39, 0.72);
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.95rem;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
    }
    .legend strong {
      width: 0.75rem;
      height: 0.75rem;
      display: inline-block;
      border-radius: 50%;
      background: currentColor;
    }
    .legend .current-indicator strong {
      background: #a855f7;
    }
    .legend .working-indicator strong {
      background: #10b981;
    }
    .legend .off-indicator strong {
      background: #d1d5db;
    }
    .legend .lunch-indicator strong {
      background: #f59e0b;
    }
    .table-wrapper {
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      box-shadow: 0 40px 100px rgba(15, 23, 42, 0.12);
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid rgba(148, 163, 184, 0.16);
      backdrop-filter: blur(14px);
    }
    .table-wrapper::-webkit-scrollbar {
      height: 10px;
    }
    .table-wrapper::-webkit-scrollbar-track {
      background: rgba(229, 231, 235, 0.45);
      border-radius: 999px;
    }
    .table-wrapper::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.8);
      border-radius: 999px;
    }
    .table-wrapper::-webkit-scrollbar-thumb:hover {
      background: rgba(79, 70, 229, 0.9);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1120px;
    }
    th, td {
      padding: 14px 12px;
      text-align: center;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      font-size: 0.92rem;
      transition: background 0.2s ease;
    }
    th {
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.92), rgba(79, 70, 229, 0.95));
      color: white;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      font-size: 0.84rem;
      position: sticky;
      top: 0;
      z-index: 11;
    }
    th:first-child {
      position: sticky;
      left: 0;
      z-index: 13;
      background: linear-gradient(180deg, rgba(79, 70, 229, 0.98), rgba(99, 102, 241, 0.98));
    }
    th.current-hour {
      background: #7c3aed;
    }
    td:first-child {
      position: sticky;
      left: 0;
      background: rgba(255,255,255,0.98);
      font-weight: 700;
      text-align: left;
      min-width: 240px;
      max-width: 320px;
      padding-right: 18px;
      border-right: 1px solid rgba(148, 163, 184, 0.16);
      cursor: pointer;
      user-select: none;
      z-index: 14;
      box-shadow: inset -6px 0 8px -6px rgba(15, 23, 42, 0.08);
    }
    td:first-child:hover {
      background: rgba(249, 250, 251, 0.96);
    }
    .member-name {
      display: block;
      font-size: 1rem;
      letter-spacing: -0.01em;
      margin-bottom: 0.2rem;
      color: #111827;
    }
    .member-subtitle {
      display: block;
      font-size: 0.8rem;
      color: #6b7280;
      font-weight: 500;
    }
    .member-country {
      display: inline-block;
      margin-top: 0.3rem;
      color: #6b7280;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .member-country.dst-country {
      padding: 0.18rem 0.4rem;
      border-radius: 5px;
      background: #fef08a;
      color: #713f12;
    }
    .working {
      position: relative;
      overflow: hidden;
      color: #0f172a;
      background: rgba(16, 185, 129, 0.08);
    }
    .working::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: var(--fill, 100%);
      background: linear-gradient(to right, rgba(164, 243, 235, 0.92), rgba(16, 185, 129, 0.78));
      z-index: 0;
    }
    .working.partial-start::before {
      left: auto;
      right: 0;
      background: linear-gradient(to right, rgba(167, 243, 208, 0.95), rgba(16, 185, 129, 0.95));
      transform-origin: right;
    }
    .working.partial-end::before {
      left: 0;
      right: auto;
      background: linear-gradient(to right, rgba(167, 243, 208, 0.95), rgba(16, 185, 129, 0.95));
      transform-origin: left;
    }
    .working .cell-content {
      position: relative;
      z-index: 1;
    }
    .lunch {
      position: relative;
      color: #92400e;
      background: linear-gradient(135deg, rgba(253, 186, 116, 0.35), rgba(251, 191, 36, 0.18));
      font-weight: 700;
    }
    .lunch .cell-content {
      position: relative;
      z-index: 1;
    }
    .not-working {
      background: rgba(248, 250, 252, 0.88);
      color: #9ca3af;
    }
    .current-hour {
      box-shadow: inset 3px 0 0 0 rgba(168, 85, 247, 0.95);
    }
    tr:hover td:not(.lunch) {
      background: rgba(15, 23, 42, 0.03);
    }
    tr:hover td:first-child {
      background: rgba(255,255,255,0.98);
    }
    td.lunch:hover {
      background: linear-gradient(135deg, rgba(253, 186, 116, 0.35), rgba(251, 191, 36, 0.18));
    }
    th.column-hover,
    td.column-hover {
      background: rgba(99, 102, 241, 0.16) !important;
    }
    th.column-selected,
    td.column-selected {
      background: rgba(99, 102, 241, 0.24) !important;
      color: #111827;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 2.25rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #6b7280;
    }
    .close-btn:hover {
      color: #111827;
    }
    .modal-content h2 {
      margin-bottom: 1.5rem;
      color: #111827;
      font-size: 1.4rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #111827;
    }
    .form-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 0.95rem;
    }
    .form-group input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }
    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }
    button {
      flex: 1;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    button:hover {
      transform: translateY(-1px);
    }
    .btn-primary {
      background: #6366f1;
      color: white;
      box-shadow: 0 18px 40px rgba(99, 102, 241, 0.18);
    }
    .btn-primary:hover {
      background: #4f46e5;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #111827;
    }
    .btn-secondary:hover {
      background: #e5e7eb;
    }
    footer {
      padding: 1.5rem 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.82rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="tabs" aria-label="Support team sections">
      <button class="tab-button active" type="button" data-tab="support" aria-selected="true">Support team</button>
      <button class="tab-button" type="button" data-tab="technical" aria-selected="false">Technical support team</button>
      <button class="tab-button" type="button" data-tab="operations" aria-selected="false">Support operations team</button>
    </nav>
    <div class="hero">
      <div>
        <div class="view-label">Current view</div>
        <h1 id="viewTitle">Support team</h1>
        <p id="viewDescription">See your team’s time zones in a clean, modern schedule view. Each row shows a member’s local hours and work window, with the current UTC column highlighted.</p>
      </div>
      <div class="legend">
        <span class="working-indicator"><strong></strong> Working hours</span>
        <span class="off-indicator"><strong></strong> Out of work</span>
        <span class="lunch-indicator"><strong></strong> Lunch break</span>
        <span class="current-indicator"><strong></strong> Current time (UTC)</span>
      </div>
    </div>
    <div class="table-wrapper">
      <table id="table"></table>
    </div>
    <footer>Developed by Renata Farago</footer>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2>Edit <span id="modalName"></span></h2>

      <div class="form-group">
        <label>Start time (UTC)</label>
        <input type="number" id="editStart" step="0.01">
      </div>

      <div class="form-group">
        <label>End time (UTC)</label>
        <input type="number" id="editEnd" step="0.01">
      </div>

      <div class="button-group">
        <button class="btn-primary" onclick="saveEdit()">Save</button>
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const WORK_DAY_HOURS = 7 + 40/60;
    const LUNCH_HOUR = 1;

    const data = [
      { name: 'Mitali', country: 'India', offset: 4.5, start: 3, end: 3 + WORK_DAY_HOURS },
      { name: 'Ranjana', country: 'India', offset: 4.5, start: 3 + 41/60, end: 3 + 41/60 + WORK_DAY_HOURS },
      { name: 'Luca', country: 'Ireland', offset: 1, start: 3, end: 3 + WORK_DAY_HOURS },
      { name: 'Aleksandar', country: 'Serbia', offset: 2, start: 5, end: 5 + WORK_DAY_HOURS },
      { name: 'Milena', country: 'Serbia', offset: 2, start: 6, end: 6 + WORK_DAY_HOURS },
      { name: 'Renata', country: 'Portugal', offset: 1, start: 8, end: 8 + WORK_DAY_HOURS },
      { name: 'Juan', country: 'Argentina', offset: -4, start: 11 + 10/60, end: 11 + 10/60 + WORK_DAY_HOURS },
      { name: 'Hannes', country: 'Brazil', offset: -4, start: 12, end: 12 + WORK_DAY_HOURS },
      { name: 'Fede', country: 'Argentina', offset: -4, start: 12 + 10/60, end: 12 + 10/60 + WORK_DAY_HOURS },
      { name: 'Cesar', country: 'Costa Rica', offset: -6, start: 13, end: 13 + WORK_DAY_HOURS },
      { name: 'João', country: 'Brazil', offset: -4, start: 15, end: 15 + WORK_DAY_HOURS },
      { name: 'Marco', country: 'Costa Rica', offset: -6, start: 15, end: 15 + WORK_DAY_HOURS },
      { name: 'Marci', country: 'Costa Rica', offset: -6, start: 15, end: 15 + WORK_DAY_HOURS },
      { name: 'Everton', country: 'Brazil', offset: -4, start: 18, end: 18 + WORK_DAY_HOURS }
    ];
    const technicalTeamMembers = new Set(['Mitali', 'Ranjana', 'Aleksandar', 'Renata', 'Juan', 'Hannes', 'João', 'Marco', 'Everton']);
    const technicalData = data
      .filter(member => technicalTeamMembers.has(member.name))
      .map(member => ({ ...member }));
    const operationsData = [
      { name: 'Luca', country: 'Ireland', offset: 1, start: 3, end: 3 + WORK_DAY_HOURS },
      { name: 'Fede', country: 'Argentina', offset: -4, start: 12 + 10/60, end: 12 + 10/60 + WORK_DAY_HOURS },
      { name: 'Cesar', country: 'Costa Rica', offset: -6, start: 13, end: 13 + WORK_DAY_HOURS },
      { name: 'Marci', country: 'Costa Rica', offset: -6, start: 15, end: 15 + WORK_DAY_HOURS }
    ];

    const STORAGE_KEY = 'teamSchedule';
    const TECHNICAL_STORAGE_KEY = 'technicalTeamSchedule';
    const OPERATIONS_STORAGE_KEY = 'operationsTeamSchedule';
    const STORAGE_VERSION = 18;
    const daylightSavingCountries = new Set(['Ireland', 'Serbia', 'Portugal']);

    function loadTeamData(storageKey = STORAGE_KEY, fallback = data) {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        if (!parsed || parsed.version !== STORAGE_VERSION || !Array.isArray(parsed.members)) {
          return fallback;
        }
        return parsed.members;
      } catch (error) {
        return fallback;
      }
    }

    function saveTeamData() {
      const storageKey = activeTab === 'operations'
        ? OPERATIONS_STORAGE_KEY
        : activeTab === 'technical' ? TECHNICAL_STORAGE_KEY : STORAGE_KEY;
      localStorage.setItem(storageKey, JSON.stringify({ version: STORAGE_VERSION, members: teamData }));
    }

    let teamData = loadTeamData();
    let editingIndex = -1;
    let activeTab = 'support';
    const viewDetails = {
      support: {
        title: 'Support team',
        description: 'See your team’s time zones in a clean, modern schedule view. Each row shows a member’s local hours and work window, with the current UTC column highlighted.'
      },
      technical: {
        title: 'Technical support team',
        description: 'Coordinate technical support coverage across the team’s time zones and working hours.'
      },
      operations: {
        title: 'Support operations team',
        description: 'Coordinate support operations coverage across the team’s time zones and working hours.'
      }
    };

    function switchTab(tabName) {
      const details = viewDetails[tabName] || viewDetails.support;
      saveTeamData();
      activeTab = tabName;
      teamData = activeTab === 'operations'
        ? loadTeamData(OPERATIONS_STORAGE_KEY, operationsData)
        : activeTab === 'technical'
          ? loadTeamData(TECHNICAL_STORAGE_KEY, technicalData)
          : loadTeamData();
      document.getElementById('viewTitle').textContent = details.title;
      document.getElementById('viewDescription').textContent = details.description;
      document.querySelectorAll('.tab-button').forEach((button) => {
        const isActive = button.dataset.tab === tabName;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-selected', String(isActive));
      });
      render();
    }

    function normalizeHour(hour) {
      return ((hour % 24) + 24) % 24;
    }

    function formatHour(hour) {
      const normalized = normalizeHour(hour);
      const totalMinutes = Math.round((normalized % 1) * 60) + Math.floor(normalized) * 60;
      const fixedMinutes = ((totalMinutes % 1440) + 1440) % 1440;
      const displayHour = Math.floor(fixedMinutes / 60);
      const displayMinutes = fixedMinutes % 60;
      return `${displayHour.toString().padStart(2, '0')}:${displayMinutes.toString().padStart(2, '0')}`;
    }

    function getHourOverlap(member, hour) {
      const slotStart = hour;
      const slotEnd = hour + 1;

      if (member.start <= member.end) {
        return Math.max(0, Math.min(slotEnd, member.end) - Math.max(slotStart, member.start));
      }

      const firstPart = Math.max(0, Math.min(slotEnd, 24) - Math.max(slotStart, member.start));
      const secondPart = Math.max(0, Math.min(slotEnd, member.end) - Math.max(slotStart, 0));
      return firstPart + secondPart;
    }

    let selectedColumn = null;

    function clearColumnHover() {
      document.querySelectorAll('#table .column-hover').forEach(cell => cell.classList.remove('column-hover'));
    }

    function setColumnHover(index) {
      clearColumnHover();
      document.querySelectorAll(`#table [data-col='${index}']`).forEach(cell => cell.classList.add('column-hover'));
    }

    function clearColumnSelected() {
      document.querySelectorAll('#table .column-selected').forEach(cell => cell.classList.remove('column-selected'));
    }

    function setColumnSelected(index) {
      selectedColumn = index;
      clearColumnSelected();
      document.querySelectorAll(`#table [data-col='${index}']`).forEach(cell => cell.classList.add('column-selected'));
    }

    function render() {
      const table = document.getElementById('table');
      table.innerHTML = '';

      // Header
      const headerRow = document.createElement('tr');
      const headerName = document.createElement('th');
      headerName.textContent = 'Member';
      headerRow.appendChild(headerName);
      const currentUtcHour = new Date().getUTCHours();

      for (let h = 0; h < 24; h++) {
        const th = document.createElement('th');
        th.textContent = h.toString().padStart(2, '0');
        th.dataset.col = h;
        if (h === currentUtcHour) th.classList.add('current-hour');
        th.addEventListener('mouseenter', () => setColumnHover(h));
        th.addEventListener('mouseleave', clearColumnHover);
        th.addEventListener('click', () => setColumnSelected(h));
        headerRow.appendChild(th);
      }
      table.appendChild(headerRow);

      // Data rows
      teamData.forEach((member, idx) => {
        const row = document.createElement('tr');

        const nameCell = document.createElement('td');
        const startLocal = normalizeHour(member.start + member.offset);
        const endLocal = normalizeHour(member.end + member.offset);
        const startStr = formatHour(startLocal);
        const endStr = formatHour(endLocal);
        const offsetSign = member.offset >= 0 ? `+${member.offset}` : member.offset;

        nameCell.innerHTML = `
          <span class="member-name">${member.name}</span>
          <span class="member-subtitle">UTC${offsetSign} · ${startStr} – ${endStr}</span>
          <span class="member-country${daylightSavingCountries.has(member.country) ? ' dst-country' : ''}"${daylightSavingCountries.has(member.country) ? ' title="This country observes daylight saving time"' : ''}>${member.country}</span>
        `;
        nameCell.onclick = () => openModal(idx);
        row.appendChild(nameCell);

        const lunchStart = Number.isFinite(member.start) ? normalizeHour(startLocal + 4) : null;
        const lunchHour = lunchStart !== null ? Math.floor(lunchStart) : null;

        for (let h = 0; h < 24; h++) {
          const cell = document.createElement('td');
          const slotStart = h + member.offset;
          const localHour = normalizeHour(slotStart);
          const overlap = getHourOverlap({ start: startLocal, end: endLocal }, localHour);
          const isWorking = overlap > 0;
          const fillPct = Math.min(100, Math.max(0, overlap * 100));
          const isLunch = lunchHour !== null && Math.floor(localHour) === lunchHour && isWorking;

          if (isLunch) {
            cell.classList.add('lunch');
            cell.setAttribute('title', 'Lunch break');
          } else if (isWorking) {
            cell.classList.add('working');
            cell.style.setProperty('--fill', `${fillPct}%`);

            const slotEnd = localHour + 1;
            const startBoundary = startLocal >= localHour && startLocal < slotEnd;
            const endBoundary = endLocal > localHour && endLocal <= slotEnd;

            if (startBoundary && !endBoundary) {
              cell.classList.add('partial-start');
            } else if (endBoundary && !startBoundary) {
              cell.classList.add('partial-end');
            }
          } else {
            cell.classList.add('not-working');
          }

          const displayHour = formatHour(localHour);
          const content = document.createElement('span');
          content.className = 'cell-content';
          content.textContent = isLunch ? '🍴' : displayHour;
          cell.appendChild(content);
          cell.style.fontSize = isLunch ? '1rem' : '11px';
          cell.dataset.col = h;
          cell.addEventListener('mouseenter', () => setColumnHover(h));
          cell.addEventListener('mouseleave', clearColumnHover);
          cell.addEventListener('click', () => setColumnSelected(h));

          row.appendChild(cell);
        }

        table.appendChild(row);
      });

      saveTeamData();
    }

    function openModal(idx) {
      editingIndex = idx;
      const member = teamData[idx];
      document.getElementById('modalName').textContent = member.name;
      document.getElementById('editStart').value = member.start;
      document.getElementById('editEnd').value = member.end;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function saveEdit() {
      const member = teamData[editingIndex];
      const startValue = parseFloat(document.getElementById('editStart').value);
      const endValue = parseFloat(document.getElementById('editEnd').value);
      if (isNaN(startValue) || isNaN(endValue)) {
        alert('Please enter valid times.');
        return;
      }
      member.start = startValue;
      member.end = endValue;
      render();
      closeModal();
    }

    window.onclick = (e) => {
      const modal = document.getElementById('modal');
      if (e.target === modal) closeModal();
    };

    document.querySelectorAll('.tab-button').forEach((button) => {
      button.addEventListener('click', () => switchTab(button.dataset.tab));
    });

    render();
  </script>
</body>
</html>

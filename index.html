<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Timezone Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: #333;
      font-size: 24px;
    }
    .table-wrapper {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow-y: hidden;
      overflow-x: auto;
    }
    .table-wrapper::-webkit-scrollbar {
      height: 12px;
    }
    .table-wrapper::-webkit-scrollbar-track {
      background: #f0f0f0;
    }
    .table-wrapper::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 6px;
    }
    .table-wrapper::-webkit-scrollbar-thumb:hover {
      background: #5568d3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 8px;
      text-align: center;
      border: 1px solid #e0e0e0;
      font-size: 12px;
    }
    th {
      background: #667eea;
      color: white;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    th:first-child {
      position: sticky;
      left: 0;
      z-index: 11;
      background: #667eea;
    }
    td:first-child {
      position: sticky;
      left: 0;
      background: #f9f9f9;
      font-weight: 600;
      text-align: left;
      min-width: 180px;
      cursor: pointer;
      user-select: none;
      z-index: 1;
    }
    td:first-child:hover {
      background: #f0f0f0;
    }
    .working {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-weight: 600;
    }
    .not-working {
      background: #fafafa;
      color: #999;
    }
    tr:nth-child(even) td:not(:first-child):not(.working) {
      background: #ffffff;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #999;
    }
    .close-btn:hover {
      color: #333;
    }
    .modal-content h2 {
      margin-bottom: 1.5rem;
      color: #333;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }
    button {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: #667eea;
      color: white;
    }
    .btn-primary:hover {
      background: #5568d3;
    }
    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }
    .btn-secondary:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌍 Team Timezone Map</h1>

    <div class="table-wrapper">
      <table id="table"></table>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2>Editar <span id="modalName"></span></h2>

      <div class="form-group">
        <label>Início (hora em Portugal)</label>
        <input type="number" id="editStart" step="0.01">
      </div>

      <div class="form-group">
        <label>Fim (hora em Portugal)</label>
        <input type="number" id="editEnd" step="0.01">
      </div>

      <div class="button-group">
        <button class="btn-primary" onclick="saveEdit()">Salvar</button>
        <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const data = [
      { name: 'Mitali', offset: 4.5, start: 3, end: 11.5 },
      { name: 'Ranjana', offset: 4.5, start: 3 + 41/60, end: 12 + 10/60 },
      { name: 'Aleksandar', offset: 2, start: 6, end: 14 },
      { name: 'Renata', offset: 1, start: 9, end: 18 },
      { name: 'Juan', offset: -4, start: 11 + 10/60, end: 19 + 10/60 },
      { name: 'Hannes', offset: -4, start: 12, end: 20 },
      { name: 'João', offset: -4, start: 15, end: 23 },
      { name: 'Marco', offset: -6, start: 15, end: 24 },
      { name: 'Everton', offset: -4, start: 18, end: 27 }
    ];

    let teamData = JSON.parse(localStorage.getItem('teamSchedule')) || data;
    let editingIndex = -1;

    function render() {
      const table = document.getElementById('table');
      table.innerHTML = '';

      // Header
      const headerRow = document.createElement('tr');
      const headerName = document.createElement('th');
      headerName.textContent = 'Membro';
      headerRow.appendChild(headerName);

      for (let h = 0; h < 24; h++) {
        const th = document.createElement('th');
        th.textContent = h.toString().padStart(2, '0');
        th.style.minWidth = '40px';
        headerRow.appendChild(th);
      }
      table.appendChild(headerRow);

      // Data rows
      teamData.forEach((member, idx) => {
        const row = document.createElement('tr');

        const nameCell = document.createElement('td');
        const startH = Math.floor(member.start);
        const startM = Math.round((member.start - startH) * 60);
        const endH = Math.floor(member.end);
        const endM = Math.round((member.end - endH) * 60);
        const startStr = `${startH.toString().padStart(2, '0')}:${startM.toString().padStart(2, '0')}`;
        const endStr = `${endH.toString().padStart(2, '0')}:${endM.toString().padStart(2, '0')}`;

        nameCell.innerHTML = `<strong>${member.name}</strong><br><span style="font-size: 11px; color: #666; font-weight: 400;">${startStr} - ${endStr}</span>`;
        nameCell.onclick = () => openModal(idx);
        row.appendChild(nameCell);

        for (let h = 0; h < 24; h++) {
          const cell = document.createElement('td');

          // Converter horários de Portugal (GMT+1) para GMT
          const startGMT = member.start - 1;
          const endGMT = member.end - 1;

          // Converter hora GMT atual para hora local
          const localHourFloat = h + member.offset;
          const normalizedLocal = ((localHourFloat % 24) + 24) % 24;

          // Verificar se está trabalhando (comparar a hora local com horário de trabalho em hora local)
          const startLocal = startGMT + member.offset;
          const endLocal = endGMT + member.offset;

          let isWorking = false;
          if (startLocal <= endLocal) {
            isWorking = normalizedLocal >= startLocal && normalizedLocal < endLocal;
          } else {
            isWorking = normalizedLocal >= startLocal || normalizedLocal < endLocal;
          }

          if (isWorking) {
            cell.classList.add('working');
          } else {
            cell.classList.add('not-working');
          }

          // Calcular hora local para exibição
          const displayHour = Math.floor(normalizedLocal);
          const displayMin = Math.round((normalizedLocal - displayHour) * 60);
          cell.textContent = `${displayHour.toString().padStart(2, '0')}:${displayMin.toString().padStart(2, '0')}`;
          cell.style.fontSize = '11px';

          row.appendChild(cell);
        }

        table.appendChild(row);
      });

      localStorage.setItem('teamSchedule', JSON.stringify(teamData));
    }

    function openModal(idx) {
      editingIndex = idx;
      const member = teamData[idx];
      document.getElementById('modalName').textContent = member.name;
      document.getElementById('editStart').value = member.start;
      document.getElementById('editEnd').value = member.end;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function saveEdit() {
      const member = teamData[editingIndex];
      member.start = parseFloat(document.getElementById('editStart').value);
      member.end = parseFloat(document.getElementById('editEnd').value);
      render();
      closeModal();
    }

    window.onclick = (e) => {
      const modal = document.getElementById('modal');
      if (e.target === modal) closeModal();
    };

    render();
  </script>
</body>
</html>
